<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-src 'none'; form-action 'none'">
  <title>Hasselblad · 只读调试客户端</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="../dist/renderer/renderer.js"></script>
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">H</span><div>HASSELBLAD<span>研究与诊断</span></div></div>
    <div class="sidebar-label">WORKSPACE / 01</div>
    <nav aria-label="工作台导航">
      <button class="nav-item active" data-page="overview"><span class="nav-icon">◫</span>诊断总览<span class="nav-number">01</span></button>
      <button class="nav-item" data-page="parameters"><span class="nav-icon">≡</span>参数目录<span class="nav-number">02</span></button>
      <button class="nav-item" data-page="trigger"><span class="nav-icon">⌁</span>触发链路<span class="nav-number">03</span></button>
      <button class="nav-item" data-page="region"><span class="nav-icon">◎</span>地区信息<span class="nav-number">04</span></button>
      <button class="nav-item" data-page="session"><span class="nav-icon">⇄</span>连接与证据<span class="nav-number">05</span></button>
      <button class="nav-item" data-page="firmware"><span class="nav-icon">⋮</span>固件内部事件<span class="nav-number">06</span></button>
    </nav>
    <div class="sidebar-device"><div class="camera-outline"><div class="lens-outline"></div></div><strong>X2D 100C</strong><p>第一代 · 研究对象</p><span id="device-status" class="pill neutral">默认离线</span></div>
    <div class="sidebar-bottom"><span class="readonly-dot"></span>只读功能集<span class="version">v0.1.0</span></div>
  </aside>
  <div class="workspace">
    <header class="topbar"><div class="breadcrumb">研究工作台 <span>/</span> <strong id="page-name">诊断总览</strong></div><div class="top-status"><span class="status-dot"></span>USB 参数请求 <b id="hardware-count">0</b><span class="separator"></span><span>固定白名单 · 读取后关闭</span></div></header>
    <main>
      <div class="heading"><div><div class="eyebrow">X2D 100C / READ-ONLY DIAGNOSTICS</div><h1 id="heading">只读调试工作台</h1><p id="subtitle">先核查参数与协议，再判断三类触发链路能看见什么。</p></div><button id="export" class="button secondary" title="仅导出脱敏数据和来源">↗ 导出诊断报告</button></div>
      <div id="source-banner" class="source-banner"><span class="source-icon">◇</span><div><strong id="source-title">离线研究</strong><span id="source-detail">尚无实机数据</span></div><button id="reset" class="text-button">清空诊断</button></div>
      <div class="toolbar"><div class="toolbar-left"><button id="simulate" class="button primary">▷ 运行模拟诊断</button><select id="scenario" aria-label="模拟响应场景"><option value="snapshot">参数响应样例</option><option value="unauthorized">401 · 访问被拒绝</option><option value="redirect">302 · 拒绝重定向</option><option value="oversize">响应大小超限</option><option value="timeout">响应超时</option><option value="malformed">无效 JSON</option></select><button id="import" class="button secondary">↓ 导入参数响应</button></div><button id="connect" class="button outline">连接状态 / 断开</button></div>
      <section id="page-content" aria-live="polite"><p>正在加载离线证据…</p></section>
      <footer><span>所有显示结果均附来源。参数快照不等于物理时序。</span><span id="baseline">分析基线 · 官方 4.2.0</span></footer>
    </main>
  </div>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
